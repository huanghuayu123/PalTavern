appId: com.tavernsocial.desktop
productName: PalTavern
asar: false
directories:
  app: desktop
  output: release
files:
  - main.cjs
  - package.json
extraResources:
  - from: scripts/independent-chat-server.mjs
    to: scripts/independent-chat-server.mjs
  - from: dist/independent-chat
    to: dist/independent-chat
win:
  executableName: PalTavern
  target:
    - nsis
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.social-networking
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-${arch}.${ext}"
linux:
  category: Network
  target:
    - AppImage
    - deb
  artifactName: "${productName}-${version}-${arch}.${ext}"
